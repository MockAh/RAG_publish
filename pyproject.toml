[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excavador"
version = "0.1.0"
description = "Excavador: recolección, normalización y filtrado de PaperRecord para el corpus del Proyecto."
requires-python = ">=3.12"
dependencies = [
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "tenacity",
    "typer",
    "sentence-transformers",
    "chromadb",
    "lxml",
    "google-genai",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["excavador", "biblioteca", "expertos"]

[tool.pytest.ini_options]
markers = [
    "slow: usa el modelo real de embeddings",
]
addopts = "-m 'not slow'"
